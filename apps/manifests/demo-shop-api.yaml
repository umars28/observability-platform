---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-shop-api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo-shop-api }
  template:
    metadata:
      labels:
        app: demo-shop-api
        tenant: _default
      annotations:
        prometheus.io/scrape: "false"  # metrics go via OTLP, not scrape
    spec:
      containers:
        - name: app
          image: demo-shop-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http,  containerPort: 8080 }
            - { name: pprof, containerPort: 6060 }
          env:
            - { name: OTEL_SERVICE_NAME, value: demo-shop-api }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: alloy.observability.svc:4317 }
            - { name: PYROSCOPE_ENDPOINT, value: http://pyroscope.observability.svc:4040 }
            - { name: BLOG_WEB_URL, value: http://demo-blog-web.demo.svc:3000 }
            - { name: TENANT, value: _default }
            - { name: APP_ENV, value: local }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: demo-shop-api
  namespace: demo
spec:
  selector: { app: demo-shop-api }
  ports:
    - { name: http,  port: 8080, targetPort: http }
    - { name: pprof, port: 6060, targetPort: pprof }
