# Mimir — local kind overlay
# MinIO endpoint, ephemeral storage, tiny footprint.
mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          endpoint: minio.minio.svc:9000
          insecure: true
          region: us-east-1
          access_key_id: minio
          secret_access_key: minio-local-secret
          bucket_name: mimir-metrics
    blocks_storage:
      backend: s3
      s3:
        bucket_name: mimir-metrics
    alertmanager_storage:
      backend: s3
      s3:
        bucket_name: mimir-metrics
    ruler_storage:
      backend: s3
      s3:
        bucket_name: mimir-metrics
