# ingress-nginx — production cluster
# Uses LoadBalancer (MetalLB or cloud LB); enable proxy protocol per provider
controller:
  replicaCount: 2
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations: {}  # e.g. "load-balancer.hetzner.cloud/location: fsn1"
  ingressClassResource:
    default: true
  config:
    use-proxy-protocol: "false"  # flip to "true" if LB does PROXY protocol
    ssl-protocols: "TLSv1.2 TLSv1.3"
    proxy-body-size: "16m"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # enabled by meta-observability layer
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
