# MinIO — local S3-compatible storage for kind
# Single-node ephemeral mode: ideal for developer laptops.
# In production, use a real S3-compatible service (R2, S3, B2).
mode: standalone
replicas: 1

rootUser: minio
rootPassword: minio-local-secret  # local only — do NOT reuse in production

persistence:
  enabled: true
  size: 10Gi
  storageClass: standard

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# Pre-create buckets for each pillar
buckets:
  - name: mimir-metrics
    policy: none
    purge: false
  - name: loki-logs
    policy: none
    purge: false
  - name: tempo-traces
    policy: none
    purge: false
  - name: pyroscope-profiles
    policy: none
    purge: false

service:
  type: ClusterIP
  port: 9000
consoleService:
  type: ClusterIP
  port: 9001

metrics:
  serviceMonitor:
    enabled: false
