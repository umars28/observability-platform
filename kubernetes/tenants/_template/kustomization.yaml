apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
commonLabels:
  tenant: __TENANT__
  managed-by: platform

resources:
  - datasources.yaml
  - alerts/basic.yaml

# tenant.yaml and limits.yaml are metadata for the platform tooling;
# they are consumed by scripts, not by the K8s API server directly.
