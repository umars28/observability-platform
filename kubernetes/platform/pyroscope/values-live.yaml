pyroscope:
  config: |
    multitenancy_enabled: true
    storage:
      backend: s3
      s3:
        endpoint: __OBJECT_STORE_ENDPOINT__
        bucket_name: __OBJECT_STORE_BUCKET_PYROSCOPE__
        region: __OBJECT_STORE_REGION__
        # access_key_id / secret_access_key from env

services:
  - target: all
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 2000m, memory: 4Gi }
    persistence:
      size: 50Gi
    extraEnvFrom:
      - secretRef: { name: pyroscope-object-storage }
