# Grafana datasources scoped to this tenant.
# Deployed as a ConfigMap picked up by Grafana's sidecar (label grafana_datasource=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-__TENANT__
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: "Mimir (__TENANT__)"
        type: prometheus
        uid: mimir-__TENANT__
        url: http://mimir-nginx.observability.svc/prometheus
        access: proxy
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: __TENANT__
      - name: "Loki (__TENANT__)"
        type: loki
        uid: loki-__TENANT__
        url: http://loki-gateway.observability.svc
        access: proxy
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: __TENANT__
      - name: "Tempo (__TENANT__)"
        type: tempo
        uid: tempo-__TENANT__
        url: http://tempo.observability.svc:3100
        access: proxy
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          tracesToLogsV2:
            datasourceUid: loki-__TENANT__
          tracesToProfilesV2:
            datasourceUid: pyroscope-__TENANT__
        secureJsonData:
          httpHeaderValue1: __TENANT__
      - name: "Pyroscope (__TENANT__)"
        type: grafana-pyroscope-datasource
        uid: pyroscope-__TENANT__
        url: http://pyroscope.observability.svc:4040
        access: proxy
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: __TENANT__
