# ArgoCD — production cluster
# HA-friendly, TLS via cert-manager, exposed at argocd.<PLATFORM_DOMAIN>
global:
  domain: argocd.__PLATFORM_DOMAIN__

configs:
  params:
    server.insecure: false

server:
  replicas: 2
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.__PLATFORM_DOMAIN__
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    tls: true
    extraTls:
      - hosts: [argocd.__PLATFORM_DOMAIN__]
        secretName: argocd-server-tls
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

controller:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 2000m, memory: 2Gi }

repoServer:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

applicationSet:
  replicas: 2

notifications:
  enabled: true

dex:
  enabled: false  # Enable if SSO is added later

redis-ha:
  enabled: true
redis:
  enabled: false
