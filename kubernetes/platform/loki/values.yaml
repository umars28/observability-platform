# Loki — base values (Simple Scalable Deployment mode, but scaled down to monolithic-ish)
fullnameOverride: loki

deploymentMode: SingleBinary

loki:
  auth_enabled: true  # required for multi-tenancy via X-Scope-OrgID
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 30d  # per-tenant override lives in tenants/<name>/limits.yaml
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_query_length: 720h
    max_query_parallelism: 16
    volume_enabled: true
    allow_structured_metadata: true
  # Storage endpoints filled in by overlay
  # storage.bucketNames / storage.s3 filled by overlay
  compactor:
    retention_enabled: true
    delete_request_store: s3

# SingleBinary defaults — replicas dropped by overlay for local.
singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
  persistence:
    size: 10Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
ingester:
  replicas: 0

# Bundled minio disabled — we bring our own via bootstrap or use R2/S3 in prod.
minio:
  enabled: false

test:
  enabled: false

lokiCanary:
  enabled: false

gateway:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
